<section id="beneficios" class="beneficios scroll-mt-24">
  <div class="mx-auto max-w-6xl px-5 py-24 sm:px-8 sm:py-28">
    <div class="mx-auto max-w-2xl text-center" appReveal>
      <p class="eyebrow">Por qué elegirnos</p>
      <h2 class="mt-3 text-3xl font-black tracking-tight sm:text-[40px] sm:leading-tight" style="color: var(--kp-text)">Viajar con nosotros es simple</h2>
      <p class="mt-4 leading-relaxed" style="color: var(--kp-muted)">Nos encargamos de la organización para que tú solo pienses en disfrutar.</p>
    </div>

    <div class="mt-16 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (b of beneficios; track b.titulo; let i = $index) {
        <div appReveal [revealDelay]="i * 100">
          <div class="beneficio">
            <span class="beneficio-icono"><app-icon [name]="b.icono" size="w-7 h-7" [trazo]="1.25" /></span>
            <h3 class="mt-6 text-[17px] font-extrabold tracking-tight" style="color: var(--kp-text)">{{ b.titulo }}</h3>
            <p class="mt-2 text-sm leading-relaxed" style="color: var(--kp-muted)">{{ b.texto }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
