<div class="relative z-20 mx-auto -mt-16 max-w-6xl px-5 sm:-mt-14 sm:px-8">
  <form class="buscador" (ngSubmit)="enviar()" role="search" aria-label="Buscar tours">
    <label class="campo">
      <span class="campo-icono"><app-icon name="map-pin" size="w-5 h-5" [trazo]="1.5" /></span>
      <span class="flex min-w-0 flex-1 flex-col">
        <span class="campo-label">Destino</span>
        <input type="search" name="destino" [(ngModel)]="destino" list="lista-destinos" placeholder="¿A dónde quieres ir?" class="campo-input">
      </span>
    </label>
    <datalist id="lista-destinos">
      @for (d of destinos; track d) { <option [value]="d"></option> }
    </datalist>

    <label class="campo">
      <span class="campo-icono"><app-icon name="calendar" size="w-5 h-5" [trazo]="1.5" /></span>
      <span class="flex min-w-0 flex-1 flex-col">
        <span class="campo-label">Salida desde</span>
        <input type="date" name="fecha" [(ngModel)]="fecha" [min]="hoy" class="campo-input">
      </span>
    </label>

    <label class="campo">
      <span class="campo-icono"><app-icon name="compass" size="w-5 h-5" [trazo]="1.5" /></span>
      <span class="flex min-w-0 flex-1 flex-col">
        <span class="campo-label">Tipo de tour</span>
        <select name="tipo" [(ngModel)]="tipo" class="campo-input cursor-pointer">
          @for (t of tipos; track t.valor) { <option [value]="t.valor">{{ t.texto }}</option> }
        </select>
      </span>
    </label>

    <button type="submit" class="buscar-btn">
      <app-icon name="search" size="w-5 h-5" />
      <span>Buscar</span>
    </button>
  </form>
</div>
